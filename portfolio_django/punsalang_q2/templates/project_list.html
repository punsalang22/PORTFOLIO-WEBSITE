<!DOCTYPE html>
<html>
<head>
    <title>My Projects</title>

    <style>
        body{
            background:#0d1117;
            color:white;
            font-family:Arial;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            color:#58a6ff;
        }

        .project-card{
            background:#161b22;
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
            transition:0.3s;
        }

        .project-card:hover{
            transform:translateY(-5px);
        }

        a{
            text-decoration:none;
            color:white;
        }

        .title{
            font-size:24px;
            color:#58a6ff;
        }
    </style>
</head>

<body>

<h1>My Projects</h1>

{% for project in projects %}
<a href="/projects/{{ project.id }}/">
    <div class="project-card">
        <div class="title">
            {{ project.project_name }}
        </div>
    </div>
</a>
{% endfor %}

</body>
</html>
