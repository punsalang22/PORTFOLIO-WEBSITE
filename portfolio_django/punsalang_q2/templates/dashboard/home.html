{% extends 'dashboard/base.html' %}

{% block title %}Overview{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Welcome, {{ user.username }}</h1>
</div>

<div class="stats">
    <div class="card">
        <div class="muted">Projects</div>
        <div class="stat-number">{{ project_count }}</div>
        <div class="actions">
            <a href="{% url 'dashboard_projects' %}" class="btn btn-secondary">View all</a>
            <a href="{% url 'project_create' %}" class="btn">+ Create Project</a>
        </div>
    </div>

    <div class="card">
        <div class="muted">Tech Stacks</div>
        <div class="stat-number">{{ tech_stack_count }}</div>
        <div class="actions">
            <a href="{% url 'dashboard_tech_stacks' %}" class="btn btn-secondary">View all</a>
            <a href="{% url 'tech_stack_create' %}" class="btn">+ Create Tech Stack</a>
        </div>
    </div>
</div>
{% endblock %}
