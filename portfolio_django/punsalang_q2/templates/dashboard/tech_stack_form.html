{% extends 'dashboard/base.html' %}

{% block title %}Create Tech Stack{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Create Tech Stack</h1>
</div>

<div class="card form-card">
    {% if form.errors %}
    <div class="form-errors">Please fix the errors below.</div>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}

        {% for field in form %}
        <div class="field{% if field.errors %} has-error{% endif %}">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}

        <div class="actions">
            <button type="submit" class="btn">Save Tech Stack</button>
            <a href="{% url 'dashboard_tech_stacks' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
